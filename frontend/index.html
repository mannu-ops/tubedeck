<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Download YouTube videos in 4K UHD, vertical Shorts, studio 320k MP3 audio, and entire playlists with 50-track pagination in a single indexed ZIP file. Free, private, and browser-based." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://tubedeck.example/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TubeDeck" />
  <meta property="og:title" content="TubeDeck — YouTube Video, Shorts & Playlist Downloader" />
  <meta property="og:description"
    content="Download YouTube videos up to 4K, Shorts, and whole playlists as an indexed ZIP. Free, private, browser-based." />
  <meta property="og:url" content="https://tubedeck.example/" />
  <meta property="og:image" content="https://tubedeck.example/og-cover.png" />
  <meta property="og:locale" content="en_US" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TubeDeck — YouTube Video, Shorts & Playlist Downloader" />
  <meta name="twitter:description"
    content="Download YouTube videos up to 4K, Shorts, and whole playlists as an indexed ZIP. Free, private, browser-based." />
  <meta name="twitter:image" content="https://tubedeck.example/og-cover.png" />

  <!-- Structured data (WebSite + SoftwareApplication) -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "TubeDeck",
      "url": "https://tubedeck.example/",
      "description": "Free browser-based YouTube video, Shorts and playlist downloader.",
      "inLanguage": "en"
    }
    </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "TubeDeck",
      "applicationCategory": "MultimediaApplication",
      "operatingSystem": "Web",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
      "description": "Download YouTube videos, Shorts and playlists as MP4 or MP3, including ZIP batch packaging."
    }
    </script>

  <!-- Modern Scandinavian & Industrial Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Outfit:wght@500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet" />

  <!-- Minimalist Industrial Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='%23ff5500'><rect width='32' height='32' rx='6' fill='%23111317'/><circle cx='10' cy='16' r='4' fill='%23ff5500'/><circle cx='22' cy='16' r='4' fill='%23ff5500'/><rect x='10' y='14' width='12' height='4' fill='%23ff5500'/></svg>" />
</head>

<body>
  <a class="skip-link" href="#app">Skip to main content</a>
  <!-- App Root Container -->
  <main id="app" tabindex="-1"></main>

  <!-- Notification Toast Deck -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
